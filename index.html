<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Hudsify</title>
<style>
/* ===== design tokens: ONE palette for the whole app ===== */
:root{--bg:#0b0d10;--surface:#12151a;--surface2:#181b21;--surface3:#20242b;--surface4:#2c313a;--sheet:#14171c;--bar:#0b0d10d9;--line:#ffffff14;--ov1:#ffffff12;--ov2:#ffffff1f;--ov3:#ffffff33;--tx:#fff;--tx2:#9aa3ad;--g:#1ed760;--g2:#5ee58b;--gbg:#1ed7602e;--r1:10px;--r2:16px;--r3:22px;--p:var(--surface);--s:var(--surface2);--h:var(--surface3);--m:var(--tx2)}
:root[data-theme=amoled]{--bg:#000;--surface:#0a0a0a;--surface2:#101010;--surface3:#181818;--surface4:#242424;--sheet:#0d0d0d;--bar:#000000d9}
:root{--p:var(--surface);--s:var(--surface2);--h:var(--surface3);--g:var(--g);--m:var(--tx2);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.4 "Circular Std",Inter,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg{width:24px;height:24px;fill:currentColor;flex:none}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--g) 28%,#000),#000 70%);display:grid;place-content:center;justify-items:center;gap:26px;transition:opacity .7s,transform .7s;animation:spo .4s ease 6s forwards}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
@keyframes spo{to{opacity:0;visibility:hidden;pointer-events:none}}
#spi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
#splash.pic #spi{opacity:1}#splash.pic .eq,#splash.pic h1,#splash.pic p{opacity:0}
.eq{display:flex;gap:5px;align-items:flex-end;height:50px;transition:opacity .5s}
.eq i{width:6px;border-radius:3px;background:var(--g);animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2n){animation-duration:.7s;animation-delay:-.3s}.eq i:nth-child(3n){animation-duration:1.1s;animation-delay:-.6s}.eq i:nth-child(5n){animation-delay:-.1s}
@keyframes eq{0%,100%{height:6px}50%{height:50px}}
#splash h1{margin:0;font-size:56px;font-weight:900;letter-spacing:-1px;display:flex;transition:opacity .5s}
#splash h1 span{display:inline-block;background:linear-gradient(90deg,var(--g),#fff,var(--g));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wv 1.1s ease-in-out infinite,sh 2.2s linear infinite}
@keyframes wv{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes sh{to{background-position:-200% 0}}
#splash p{margin:0;color:var(--tx2);letter-spacing:.4em;font-size:12px;text-transform:uppercase;animation:fd 1.6s ease both;transition:opacity .5s}
@keyframes fd{from{opacity:0;letter-spacing:.9em}}
/* shell */
#app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto auto}
#stage{display:grid;grid-template-columns:300px minmax(0,1fr);gap:8px;padding:8px 8px 0;min-height:0}
#side{display:flex;flex-direction:column;gap:8px;min-height:0}
#main{background:var(--p);border-radius:8px;overflow:auto;min-height:0}
.box{background:var(--p);border-radius:8px;padding:8px 12px}
.lg{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;padding:8px 12px 12px}
.lg i{width:32px;height:32px;border-radius:50%;background:var(--g);color:#000;display:grid;place-items:center;font-style:normal;font-size:18px}
.nav a{display:flex;gap:20px;align-items:center;padding:10px 12px;color:var(--m);font-weight:700;font-size:16px;cursor:pointer}
.nav a:hover,.nav a.on{color:#fff}
.lib{flex:1;overflow:auto;min-height:0}
.lh{display:flex;justify-content:space-between;align-items:center;color:var(--m);font-weight:700;padding:4px 4px 12px}
.lt{display:flex;gap:12px;align-items:center}.lh .ib:hover{background:var(--h)}
.li{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}
.li:hover,.li.on{background:var(--h)}.li b{display:block;font-weight:500}.li small{color:var(--m)}
.cv{display:grid;place-items:center;border-radius:4px;flex:none;color:#ffffffd9;overflow:hidden}
.cv svg{width:40%;height:40%}.cv img{width:100%;height:100%;object-fit:cover}
.circ .cv{border-radius:50%}
.s48{width:48px;height:48px}.s40{width:40px;height:40px}
#top{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:var(--bar);backdrop-filter:blur(8px)}
#top .logo{display:none}.tr2{display:flex;gap:12px;align-items:center;margin-left:auto}
.pill{background:#fff;color:#000;border-radius:999px;padding:8px 16px;font-weight:700;text-align:center}.pill:hover{transform:scale(1.04)}
.pad{padding:0 24px 24px}
h2{font-size:24px;margin:28px 0 12px}h2.big{font-size:32px;margin:8px 0 16px}
.hero{display:flex;gap:24px;align-items:flex-end;padding:80px 24px 24px;margin-top:-56px}
.hero .cv{width:200px;height:200px;border-radius:6px;box-shadow:0 8px 40px #0008}
.hero h1{font-size:56px;line-height:1;margin:8px 0;font-weight:800}
.act{display:flex;gap:20px;align-items:center;padding:20px 24px}
.pbtn{width:56px;height:56px;border-radius:50%;background:var(--g);color:#000;display:grid;place-items:center}
.pbtn:hover{transform:scale(1.06);background:var(--g2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;background:var(--ov1);border-radius:4px;overflow:hidden;cursor:pointer;font-weight:700;padding-right:8px}
.tile:hover{background:var(--ov3)}.tile .cv{width:56px;height:56px;border-radius:0}.circ .tile .cv{border-radius:50%}
.shelf{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.card{flex:0 0 168px;min-width:0;background:var(--s);border-radius:8px;padding:14px;cursor:pointer;position:relative}
.card:hover{background:var(--h)}.card .cv{width:100%;aspect-ratio:1;margin-bottom:12px;border-radius:6px}.circ .card .cv{border-radius:50%}
.card b,.card small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:var(--m)}
.card .pbtn{position:absolute;right:22px;top:96px;width:44px;height:44px;opacity:0;transform:translateY(8px);transition:.2s}
.card:hover .pbtn{opacity:1;transform:none}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;padding:48px 16px;color:var(--m)}
.empty h3{color:#fff;margin:8px 0 0;font-size:22px}.empty p{max-width:420px;margin:0 0 12px}
.em{color:var(--m);padding:24px 12px}
.sbx{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:999px;padding:0 16px;height:48px;color:var(--m);margin-top:8px}
.sbx input{flex:1;height:100%;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px}
.chips,.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chips{margin:16px 0}
.chip{background:var(--ov2);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;text-align:center}
.chip:hover{background:var(--ov3)}.chip.on{background:#fff;color:#000}
.setr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--ov1)}
.setr.col{flex-direction:column;align-items:flex-start}.setr small{color:var(--m)}
/* track rows */
.tr{display:grid;grid-template-columns:36px minmax(0,1fr) 90px 40px 56px 32px;gap:12px;align-items:center;padding:6px 12px;border-radius:4px;color:var(--m);cursor:pointer}
.tr:hover{background:var(--ov2)}
.tr.hd{cursor:default;border-bottom:1px solid var(--ov2);border-radius:0;font-size:12px;margin-bottom:8px}.tr.hd:hover{background:none}
.n{text-align:center}.n svg{display:none;width:16px;height:16px;color:#fff;margin:auto}
.tr:hover .n span{display:none}.tr:hover .n svg{display:block}
.tr.on .t b,.tr.on .n span{color:var(--g)}
.t{display:flex;gap:12px;align-items:center;min-width:0}.t div{min-width:0}
.t b{display:block;color:#fff;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{height:1px}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--m);flex:none}
.ib:hover{color:#fff}.ib.on{color:var(--g)}
.ib:not(.on) .hh{fill:none;stroke:currentColor;stroke-width:2}
.rnd{width:40px;height:40px;background:var(--ov2);color:#fff}.rnd.on{background:color-mix(in srgb,var(--g) 20%,transparent);color:var(--g)}
/* bottom bar / mini player */
#bar{display:none;grid-template-columns:1fr minmax(0,2fr) 1fr;align-items:center;gap:12px;padding:12px 16px;height:90px}
.hasT #bar{display:grid}.npo #bar,.npo #tabs{display:none}
.inf{display:flex;gap:12px;align-items:center;min-width:0;cursor:pointer}.it{min-width:0;flex:1}
.it b,.it small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it small{color:var(--m)}
.ctr{display:flex;flex-direction:column;align-items:center;gap:6px}
.cb{display:flex;gap:16px;align-items:center}
.pp{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:none}.pp:hover{transform:scale(1.06)}
.sk{display:flex;align-items:center;gap:8px;width:100%;max-width:600px;font-size:11px;color:var(--m)}
.vol{display:flex;justify-content:flex-end;align-items:center;gap:8px}.vol input{flex:none;width:100px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:16px;margin:0;background:transparent;cursor:pointer;--v:0%;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fill,#fff) var(--v),#ffffff40 var(--v))}
input[type=range]:hover::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--g) var(--v),#ffffff40 var(--v))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;opacity:0}
input[type=range]:hover::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#ffffff40}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
@media(hover:none){input[type=range]::-webkit-slider-thumb{opacity:1}}
#tabs{display:none}
/* now playing */
#np{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--ac,var(--surface3)),var(--surface) 82%);transform:translateY(105%);visibility:hidden;transition:transform .3s,visibility .3s;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow:hidden}
#np.open{transform:none;visibility:visible}
#np.vid{background:#000}
#m{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;background:#000;object-fit:contain}
#np.vid #m{inset:0;width:100%;height:100%;opacity:1;z-index:0}
#np.a1 #m{object-fit:cover}#np.a2 #m{object-fit:fill}
#npa{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 20px 16px}
#np.vid #npa{display:none}#npv{display:none}#np.vid #npv{display:block;position:absolute;inset:0;z-index:2}
.nph{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;text-align:center;gap:8px}
.nph small{display:block;font-size:11px;color:#ffffffb3}.nph b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:flex;gap:6px;align-items:center}
.lybtn{display:flex;gap:6px;align-items:center;background:var(--ov2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.lybtn svg{width:18px;height:18px}.lybtn.on{background:#fff;color:#000}
.stg{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);padding:14px 0;position:relative}
#bigcv{height:100%;display:grid;place-items:center}
#np.lyr #bigcv{display:none}
#bigcv .cv{height:min(100%,calc(100vw - 40px));width:auto;max-width:100%;aspect-ratio:1;border-radius:8px;box-shadow:0 12px 40px #0006}
.circ #bigcv .cv{border-radius:50%}
.circ #np.playing #bigcv .cv{animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#lyrw{display:none;position:relative;min-height:0;height:100%}
#np.lyr #lyrw{display:block}
#lyr{position:relative;height:100%;overflow:auto;padding:30% 2px;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.ll{font-size:27px;font-weight:800;line-height:1.25;margin:0 0 20px;color:#ffffff59;cursor:pointer;transition:color .3s,transform .3s;transform-origin:left center}
.ll.past{color:#ffffffa6}.ll.on{color:#fff;transform:scale(1.05)}
#lyr.unsy{padding:8px 2px}#lyr.unsy .ll{color:#fff;font-size:19px;font-weight:600;cursor:default;margin-bottom:6px}
.lye{display:grid;gap:12px;justify-items:center;text-align:center;padding:48px 0;color:#ffffffb3}
.fsb{position:absolute;top:0;right:0;z-index:2;width:38px;height:38px;border-radius:50%;background:#0007;display:grid;place-items:center}
.npi{display:flex;align-items:center;gap:12px}.tt{flex:1;min-width:0;overflow:hidden}
.npi h3{display:inline-block;white-space:nowrap;font-size:24px;margin:0}.npi h3.mq{animation:mq 8s ease-in-out infinite alternate}
@keyframes mq{to{transform:translateX(var(--d,0px))}}
.npi small{display:block;font-size:16px;color:#ffffffb3}
.lkc{width:34px;height:34px;border-radius:50%;border:2px solid #ffffffb3;display:grid;place-items:center;color:#fff;flex:none}
.lkc.on{background:var(--g);border-color:var(--g);color:#000}
.sk2{margin-top:14px}.sk2 input{width:100%;display:block}
.sk2>div{display:flex;justify-content:space-between;font-size:12px;color:var(--m);margin-top:4px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px}
.ctl .big svg{width:34px;height:34px}.pp.big{width:68px;height:68px}
#np.lfs #npa .nph,#np.lfs .npi,#np.lfs .sk2,#np.lfs .ctl{display:none}#np.lfs .stg{padding:8px 0}#np.lfs #lyr{padding-top:20%}
#np.lfs .fsp{display:grid}.fsp{display:none;position:absolute;right:0;bottom:6px;z-index:2;width:46px;height:46px}
/* video player */
#vtap{position:absolute;inset:0;z-index:2}
#subs{position:absolute;left:5%;right:5%;bottom:9%;text-align:center;z-index:1;pointer-events:none;transition:bottom .25s;display:none}
#np.vid #subs{display:block}#np.vid.vc #subs{bottom:25%}
#subs div{display:inline-block;margin:2px 0;padding:2px 10px;border-radius:4px;color:#fff;line-height:1.3;text-shadow:0 1px 3px #000,0 0 2px #000;font-weight:600;font-size:var(--sz,22px)}
#np.sbg #subs div{background:#000b}#np:not(.cc) #subs{display:none!important}
.vtop,.vmid,.vbot{position:absolute;left:0;right:0;z-index:3;transition:opacity .25s}
.vtop{top:0;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(#000c,transparent)}
.vt{flex:1;min-width:0}.vt b,.vt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vt small{color:#ffffffb3}
.vmid{top:50%;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:20px;pointer-events:none}.vmid>*{pointer-events:auto}
.vb{width:48px;height:48px;border-radius:50%;background:#0006;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.vmid .pp{width:68px;height:68px}
.vbot{bottom:0;padding:28px 16px 14px;background:linear-gradient(transparent,#000d)}
.vs{display:flex;align-items:center;gap:10px;font-size:12px;color:#ffffffcc}
.vrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
#np:not(.vc) .vtop,#np:not(.vc) .vmid,#np:not(.vc) .vbot{opacity:0;pointer-events:none}
#np:not(.vc) .vmid>*{pointer-events:none}
#vspin{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
.spn{width:46px;height:46px;border:4px solid #fff4;border-top-color:#fff;border-radius:50%;animation:rt 1s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}
#vfb{position:absolute;top:50%;transform:translateY(-50%);z-index:2;pointer-events:none;background:#0008;border-radius:999px;padding:12px 18px;font-weight:800;font-size:18px}
#vfb.l{left:10%}#vfb.r{right:10%}
#np.open.rot{inset:auto;top:0;left:0;width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
/* sheets & overlays */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:16px 16px 0 0;padding:12px 16px 20px;z-index:10;max-height:82%;overflow:auto;box-shadow:0 -8px 30px #000a}
.qh{display:flex;justify-content:space-between;align-items:center;padding:4px 0 8px}
.lmr{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 4px;border-bottom:1px solid var(--ov1);font-size:15px}
.lmr:last-child{border:0}.lmr .g{display:flex;gap:4px;align-items:center;font-size:12px;color:#ffffffb3}.lmr .chip{padding:5px 10px;font-size:12px}.lmr b{min-width:42px;text-align:center;color:#fff}
.sw{width:42px;height:24px;border-radius:12px;background:var(--ov3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}.sw.on{background:var(--g)}.sw.on::after{transform:translateX(18px)}
#le{height:90%;display:flex;flex-direction:column;gap:10px}
#lt{flex:1;min-height:120px;background:var(--surface3);border:0;border-radius:8px;color:#fff;padding:12px;font-size:15px;line-height:1.5;font-family:inherit;resize:none;outline:0}
.lrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.lrow .pill{margin-left:auto}
#ts{position:absolute;inset:0;background:var(--sheet);border-radius:16px 16px 0 0;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px;z-index:2}
#tsl{flex:1;display:grid;align-content:center;gap:12px;text-align:center}#tsl h3{font-size:26px;margin:0}#tsl small{color:var(--m)}.d{color:#ffffff66;margin:0;min-height:1.4em}
.tap{height:110px;border-radius:16px;background:var(--g);color:#000;font-size:28px;font-weight:900;touch-action:manipulation}.tap:active{transform:scale(.98);background:var(--g2)}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:6px;font-weight:700;z-index:90;max-width:90vw;text-align:center}
#menu{position:fixed;z-index:80;background:var(--surface3);border-radius:6px;padding:4px;min-width:210px;box-shadow:0 16px 24px #0008}
#menu button{display:block;width:100%;padding:12px;border-radius:4px}#menu button:hover{background:var(--surface4)}
#dlg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:85}
#dlg>div{background:var(--surface3);border-radius:8px;padding:24px;width:min(90vw,380px);display:grid;gap:16px}
#dlg h3{margin:0}#dlg input{background:var(--surface4);border:0;color:#fff;border-radius:4px;padding:12px;font:inherit;outline:0}
.dbt{display:flex;justify-content:flex-end;gap:12px;align-items:center}
/* phones */
@media(max-width:800px){
#stage{grid-template-columns:minmax(0,1fr);padding:0}#side{display:none}#main{border-radius:0}
#top{padding:10px 16px}#top .logo{display:flex}#top .lg{padding:0}
.hero{flex-direction:column;align-items:flex-start;gap:12px;padding:72px 16px 8px}.hero .cv{width:150px;height:150px}.hero h1{font-size:34px}
.act{padding:12px 16px}.pad{padding:0 8px 16px}

 else if(a=='lpick'){const r=LR[+d.k];if(r&&cur){setLy(cur,r.syncedLyrics||r.plainLyrics,1);dropL('le');dropL('lm');sheet('lr',0);toast(t(r.syncedLyrics?'lySynced':'lyText'))}}
 else if(a=='lsv'){if(cur){setLy(cur,$('lt').value);sheet('le',0);toast(t('lySaved'))}}
 else if(a=='lclr'){if(cur){setLy(cur,'',1);dropL('lm');toast(t('lyGone'))}}
 else if(a=='limp')$('lin').click()
 else if(a=='lts'){if(!cur)return toast(t('playFirst'));if($('le').hidden){$('lt').value=(LY[cur.id]||{}).raw||'';dropL('lm');sheet('le',1)}tsStart()}
 else if(a=='tsx'){TS=null;$('ts').hidden=true}
 else if(a=='tsp')M.paused?M.play():M.pause()
 else if(a=='tsu'){if(TS&&TS.st.length){TS.st.pop();tsDraw()}}
 else if(a=='tsb')seekBy(-5)
 else if(a=='lseek'){const dd=cur&&LY[cur.id];if(dd&&dd.synced){M.currentTime=Math.max(0,dd.lines[+d.n].t-(cur.off||0));if(M.paused)M.play()}}
 else if(a=='loff'){if(cur){cur.off=Math.round(((cur.off||0)+ +d.v)*10)/10;save();$('lof').textContent=offTxt();lyI=-2;frame()}}
 else if(a=='lfs')lfsToggle()
 else if(a=='vcc'){smPage('main');sheet('sm',1);vShow(1)}
 else if(a=='vmore'){vmPage('main');sheet('vm',1);vShow(1)}
 else if(a=='vmp')vmPage(d.v)
 else if(a=='vmsub'){dropL('vm');smPage('main');sheet('sm',1)}
 else if(a=='vmsa'){dropL('vm');smPage('app');sheet('sm',1)}
 else if(a=='vpip'){dropL('vm');if(ML)ML.pip().catch(()=>toast(t('pipNo')))}
 else if(a=='vspd'){S.spd=+d.v;M.playbackRate=S.spd;save();ui();vmPage('main')}
 else if(a=='vasp'){S.asp=+d.v;save();ui();vmPage('main')}
 else if(a=='vaud'){audTracks().forEach((q,i)=>q.enabled=i==+d.v);vmPage('aud')}
 else if(a=='vslp'){sleepSet(d.v=='eov'?'eov':+d.v);vmPage('main')}
 else if(a=='vvol'){const s=$('vvl');s.hidden=!s.hidden;if(!s.hidden){s.value=VOc*100;rng(s);clearTimeout(vvh);vvh=setTimeout(()=>s.hidden=true,3000)}vShow(1)}
 else if(a=='vfs')FS?fsOff():fsOn()
 else if(a=='vresume')vResume()
 else if(a=='vstart')vStartOver()
 else if(a=='smp'){SMP=d.v;smPage(d.v)}
 else if(a=='ssel')subSelect(d.v)
 else if(a=='sadd')$('sin').click()
 else if(a=='sdl'){if(cur){cur.sd=Math.round(((cur.sd||0)+ +d.v)*10)/10;save();smPage(SMP);subK='x';subStep()}}
 else if(a=='sdset'){if(cur){cur.sd=+d.v;save();smPage(SMP);subK='x';subStep()}}
 else if(a=='sapp'){S[d.k]=+d.v;save();ui();smPage('app')}
 else if(a=='sdsearch')sdSearch()
 else if(a=='sdget')sdGet(+d.v)
 else if(a=='suse'){if(cur&&SD.pend){saveSub(cur,SD.pend.name,SD.pend.txt,SD.pend.lang);SD.pend=null;smPage('main')}}
 else if(a=='sopen'){if(d.v=='reset')confirmBox(t('reset'),t('resetMsg'),t('resetBtn'),doReset);else ssOpen(d.v)}
 else if(a=='stog')stog(d.v)
 else if(a=='sset'){const v=d.v;S[d.k]=(d.k=='acc'||d.k=='theme'||d.k=='op')?v:+v;save();applyTheme();ui();render();ssRefresh()}
 else if(a=='ssave'){$$('#ss [data-key]').forEach(i=>{S[i.dataset.key]=i.value.trim()});save();toast(t('saved'));render();ssRefresh()}
 else if(a=='cfx')$('cfm').hidden=true
 else if(a=='cfok'){$('cfm').hidden=true;if(cfcb)cfcb()}
 else if(a=='noop'){}
 else if(a=='oskSave'){const v=($('oskIn')||{}).value;if(v){S.osk=v.trim();save();smPage('dl')}}});
/* ---------- inputs & media events ---------- */
document.addEventListener('input',e=>{const el=e.target;
 if(el.id=='q'){S.qs=el.value;if(S.sm=='o'){clearTimeout(ot);ot=setTimeout(osearch,650)}else res()}
 else if(el.classList&&el.classList.contains('skr')){rng(el);if(M.duration)M.currentTime=el.value/1000*M.duration;SKR.forEach(i=>{if(i!==el){i.value=el.value;rng(i)}});
  if(el.id=='vsk'){const b=$('vbub');b.hidden=false;b.textContent=fm(el.value/1000*(M.duration||0));b.style.left=(el.value/10)+'%'}frame();vShow(1)}
 else if(el.id=='vvl'){const v=el.value/100;voSet(v);VOc=v;rng(el);vShow(1);clearTimeout(vvh);vvh=setTimeout(()=>el.hidden=true,3000)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.key){S[el.dataset.key]=el.value.trim();save()}});
document.addEventListener('pointerdown',e=>{const c=e.target.classList;if(c&&c.contains('skr')){sd=1;if(e.target.id=='vsk')e.target.parentNode.classList.add('drag')}});
const upAll=()=>{sd=0;$$('.vs').forEach(v=>v.classList.remove('drag'));$('vbub').hidden=true};addEventListener('pointerup',upAll);addEventListener('pointercancel',upAll);
$('vl').oninput=()=>{M.volume=$('vl').value/100;rng($('vl'))};
$('fin').onchange=async e=>{const f=[...e.target.files];e.target.value='';await add(f)};
$('sin').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)addSub(f)};
$('lin').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f){$('lt').value=await rtxt(f);toast(t('fileLoaded'))}};
$('tap').addEventListener('pointerdown',e=>{e.preventDefault();tsTap()});
M.onplay=()=>{ui();kick();vShow($('np').classList.contains('vc'));nowSync()};
M.onpause=()=>{ui();prog();frame();nowSync()};
M.onended=()=>{if(cur&&cur.v){delete POS[cur.id];savePos()}if(SLP.eov){SLP.eov=0;M.pause();toast(t('sleepDone'),3000);return}step(1,1)};
M.onerror=()=>{if(M.getAttribute('src')){$('vspin').hidden=true;toast(t(cur&&cur.v?'cantPlayV':'cantPlay'),4500)}};
M.onwaiting=()=>{$('vspin').hidden=!(cur&&cur.v)};M.onplaying=M.oncanplay=()=>{$('vspin').hidden=true};
M.onseeked=()=>{$('vspin').hidden=true;prog();frame();nowSync()};
M.onloadedmetadata=()=>{if(cur&&!cur.dur&&isFinite(M.duration)){cur.dur=M.duration;save();$$('.tr.on .du').forEach(e=>e.textContent=fm(M.duration))}
 if(PEND&&!PEND.prompt){M.currentTime=PEND.pos;PEND=null}prog();nowSync()};
M.onloadeddata=()=>{const x=cur;if(!x||!x.v||x.n||ART[x.id])return;setTimeout(()=>{try{const c=document.createElement('canvas'),w=M.videoWidth,h=M.videoHeight;if(!w)return;const s=Math.min(1,360/w);c.width=w*s;c.height=h*s;c.getContext('2d').drawImage(M,0,0,c.width,c.height);const a=c.toDataURL('image/jpeg',.7);ART[x.id]=a;put({id:'art:'+x.id,data:a});$$('.cv[data-k="'+x.id+'"]').forEach(e=>e.innerHTML='<img src="'+a+'" alt="">')}catch(e){}},500)};
M.ontimeupdate=()=>{if(!raf){prog();frame()}if(cur&&cur.v&&M.duration>300&&Date.now()-pst>5000){pst=Date.now();POS[cur.id]=M.currentTime|0;savePos()}};
addEventListener('keydown',e=>{if(e.target.id=='q'&&e.key=='Enter'&&S.sm=='o'){clearTimeout(ot);osearch();return}if(/INPUT|TEXTAREA|BUTTON|SELECT/.test(e.target.tagName))return;if(e.code=='Space'){e.preventDefault();M.paused?M.play():M.pause()}else if(e.key=='ArrowRight')seekBy(5);else if(e.key=='ArrowLeft')seekBy(-5)});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();add(e.dataTransfer.files)});
try{const ms=navigator.mediaSession;ms.setActionHandler('play',()=>M.play());ms.setActionHandler('pause',()=>M.pause());ms.setActionHandler('previoustrack',()=>step(-1));ms.setActionHandler('nexttrack',()=>step(1))}catch(e){}
/* notification / lock screen / headset buttons come back from the phone through here */
if(ML){ML.addListener('mediaAction',e=>{const a=e&&e.action;if(a=='play')M.play().catch(()=>{});else if(a=='pause')M.pause();else if(a=='next')step(1);else if(a=='prev')step(-1);else if(a=='seek'&&isFinite(e.pos))M.currentTime=e.pos}).catch(()=>{});
 ML.addListener('pipChanged',e=>{$('np').classList.toggle('pip',!!(e&&e.on))}).catch(()=>{})}
/* ---------- start ---------- */
applyTheme();applyLang();document.body.classList.toggle('circ',!!S.circ);$$('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));lfsIc();lyApply();
M.volume=.8;rng($('vl'));rng($('vvl'));render();ui();lmUp();
tx('readonly',s=>s.getAll(IDBKeyRange.bound('art:','art:\uffff'))).then(a=>{(a||[]).forEach(r=>ART[r.id.slice(4)]=r.data);render();ui()}).catch(()=>{});
if(ML)ML.status().then(s=>{if(s.granted)scan(1)}).catch(()=>{});
